# GitHub Actions - Windows Build & Release
name: Windows Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[windows,build]"
          pip install Pillow
      
      - name: Create icon
        run: python scripts/create_icon.py
      
      - name: Build Tray App Executable (PyInstaller)
        run: |
          pyinstaller --clean --noconfirm ^
            --name=redragon-tray ^
            --onefile ^
            --windowed ^
            --icon=assets/redragon.ico ^
            --add-data "config;config" ^
            --add-data "assets;assets" ^
            --add-data "src/redragon_controller/gui;gui" ^
            --hidden-import=hidapi ^
            --hidden-import=pyyaml ^
            --hidden-import=click ^
            --hidden-import=rich ^
            --hidden-import=pydantic ^
            --hidden-import=pydantic_settings ^
            --hidden-import=PySide6.QtCore ^
            --hidden-import=PySide6.QtWidgets ^
            --hidden-import=PySide6.QtGui ^
            --hidden-import=PySide6.QtSvg ^
            --hidden-import=win32serviceutil ^
            --hidden-import=win32service ^
            --hidden-import=win32event ^
            --hidden-import=servicemanager ^
            --collect-all=redragon_controller ^
            src/redragon_controller/tray_entry.py
        shell: cmd
      
      - name: Build CLI Executable (PyInstaller)
        run: |
          pyinstaller --clean --noconfirm ^
            --name=redragon-cli ^
            --onefile ^
            --console ^
            --icon=assets/redragon.ico ^
            --add-data "config;config" ^
            --add-data "assets;assets" ^
            --hidden-import=hidapi ^
            --hidden-import=pyyaml ^
            --hidden-import=click ^
            --hidden-import=rich ^
            --hidden-import=pydantic ^
            --hidden-import=pydantic_settings ^
            --collect-all=redragon_controller ^
            src/redragon_controller/cli_entry.py
        shell: cmd
      
      - name: Build Service Executable (PyInstaller)
        run: |
          pyinstaller --clean --noconfirm ^
            --name=redragon-service ^
            --onefile ^
            --console ^
            --icon=assets/redragon.ico ^
            --add-data "config;config" ^
            --add-data "assets;assets" ^
            --hidden-import=hidapi ^
            --hidden-import=pyyaml ^
            --hidden-import=click ^
            --hidden-import=rich ^
            --hidden-import=pydantic ^
            --hidden-import=pydantic_settings ^
            --hidden-import=win32serviceutil ^
            --hidden-import=win32service ^
            --hidden-import=win32event ^
            --hidden-import=servicemanager ^
            --collect-all=redragon_controller ^
            src/redragon_controller/service_entry.py
        shell: cmd
      
      - name: Verify executables
        run: |
          dir dist\*.exe
          dist\redragon-cli.exe --help
          dist\redragon-service.exe --help
        shell: cmd
      
      - name: Create installer scripts
        run: |
          @"
          @echo off
          echo Installing Redragon Controller Tray App...
          echo.
          echo The tray app will start automatically on login.
          echo.
          echo To add to startup:
          echo   1. Press Win+R, type: shell:startup
          echo   2. Create shortcut to redragon-tray.exe in that folder
          echo.
          pause
          "@ | Out-File -Encoding ASCII dist/install_tray.bat
          
          @"
          @echo off
          echo Installing Redragon Controller Service...
          redragon-service.exe install
          echo.
          echo Starting service...
          redragon-service.exe start
          echo.
          echo Service installed and started!
          echo.
          pause
          "@ | Out-File -Encoding ASCII dist/install_service.bat
          
          @"
          @echo off
          echo Stopping and uninstalling Redragon Controller Service...
          redragon-service.exe stop
          redragon-service.exe uninstall
          echo.
          echo Service uninstalled!
          pause
          "@ | Out-File -Encoding ASCII dist/uninstall_service.bat
        shell: pwsh
      
      - name: Package release
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "redragon-controller-$version-windows-x64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zipName -Force
          echo "RELEASE_ZIP=$zipName" >> $env:GITHUB_ENV
        shell: pwsh
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redragon-controller-windows
          path: |
            dist/redragon-tray.exe
            dist/redragon-cli.exe
            dist/redragon-service.exe
            dist/install_tray.bat
            dist/install_service.bat
            dist/uninstall_service.bat
          retention-days: 90
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/redragon-tray.exe
            dist/redragon-cli.exe
            dist/redragon-service.exe
            dist/install_tray.bat
            dist/install_service.bat
            dist/uninstall_service.bat
            ${{ env.RELEASE_ZIP }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}