[project]
name = "redragon-controller"
version = "0.1.0"
description = "Cross-platform Redragon RGB keyboard controller"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Redragon Controller Contributors", email = "community@redragon-controller.org"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
]
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]
optional-dependencies = {dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "pytest-cov>=4.1", "ruff>=0.1", "mypy>=1.8", "pre-commit>=3.6"], web = ["jinja2>=3.1", "websockets>=12.0"], windows = ["pywin32>=306", "winsvc>=0.1"], build = ["pyinstaller>=6.0", "nuitka>=1.0"]}

[project.scripts]
redragon = "redragon_controller.cli:main"
redragon-api = "redragon_controller.api:run_server"
redragon-service = "redragon_controller.windows_service:main"

[project.entry-points."console_scripts"]
redragon = "redragon_controller.cli:main"
redragon-api = "redragon_controller.api:run_server"
redragon-service = "redragon_controller.windows_service:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["redragon_controller*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "SIM", "T20", "ARG", "PL"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pyinstaller]
name = "redragon-controller"
onefile = true
console = false
icon = "assets/redragon.ico"
add-data = ["config/*;config", "assets/*;assets"]
hidden-imports = [
    "hidapi",
    "pyyaml",
    "click",
    "rich",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic_settings",
    "win32serviceutil",
    "win32service",
    "win32event",
    "servicemanager",
]
collect-all = ["redragon_controller"]

[tool.nuitka]
standalone = true
onefile = true
include-package = ["redragon_controller"]
include-data-dir = ["config=config", "assets=assets"]
windows-icon-from-ico = "assets/redragon.ico"
windows-console-mode = "disable"